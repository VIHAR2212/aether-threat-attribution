services:
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_dev_password
      POSTGRES_DB: aether
    ports:
      - "5432:5432"
    volumes:
      - aether_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./aether-backend
    container_name: aether-api
    environment:
      DATABASE_URL: postgresql+psycopg2://aether:aether_dev_password@postgres:5432/aether
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aether_pg_data:
